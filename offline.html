<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2742">
  <title>Offline - Kalkulator Akta</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f7fb;
      color: #172033;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 560px);
      border: 1px solid #d9e1ea;
      border-top: 5px solid #0f2742;
      border-radius: 8px;
      background: #fff;
      padding: 28px;
      box-shadow: 0 12px 34px rgba(15, 39, 66, .1);
    }
    .mark {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      margin-bottom: 20px;
      background: #0f2742;
      color: #fff;
      font-weight: 800;
    }
    h1 { margin: 0 0 12px; color: #0f2742; font-size: 24px; }
    p { margin: 0 0 12px; line-height: 1.6; color: #526173; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      margin-top: 10px;
      padding: 10px 15px;
      border-radius: 8px;
      background: #0f2742;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">PP</div>
    <h1>Koneksi internet sedang tidak tersedia.</h1>
    <p>Aplikasi utama tetap dapat digunakan apabila sebelumnya sudah pernah dibuka atau dipasang pada perangkat ini.</p>
    <a href="./index.html">Kembali ke Aplikasi</a>
  </main>
</body>
</html>
